<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lam_ia 🎾</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: Georgia, "Times New Roman", serif;
  background: #f3c4c9;
}

/* =========================
   SCÈNE
========================= */

.scene {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

/* =========================
   PORTE
========================= */

.door-scene {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(
      135deg,
      #78bfc1 0%,
      #9fd3cd 48%,
      #e8b7b9 100%
    );
  transition: opacity 1.5s ease;
}

.door-decoration {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.flower-left,
.flower-right {
  position: absolute;
  bottom: 7%;
  font-size: 65px;
  line-height: 1.1;
  filter: drop-shadow(0 5px 5px rgba(0,0,0,.15));
}

.flower-left {
  left: 3%;
}

.flower-right {
  right: 3%;
}

.door-title {
  position: absolute;
  top: 11%;
  width: 100%;
  text-align: center;
  color: #304f57;
  padding: 0 20px;
}

.door-title h1 {
  font-size: 28px;
  margin-bottom: 8px;
}

.door-title p {
  font-family: Arial, sans-serif;
  font-size: 14px;
  opacity: .8;
}

.door {
  position: relative;
  width: 220px;
  height: 400px;
  background: linear-gradient(145deg, #a87882, #c18a92);
  border: 9px solid #654d54;
  border-radius: 8px 8px 0 0;
  box-shadow: 0 25px 50px rgba(40, 60, 65, .35);
  cursor: pointer;
  transform-origin: left center;
  transition: transform 1.5s ease;
}

.door-panel {
  position: absolute;
  left: 25px;
  right: 25px;
  height: 115px;
  border: 3px solid rgba(70, 45, 55, .3);
}

.door-panel.top {
  top: 30px;
}

.door-panel.bottom {
  bottom: 30px;
}

.handle {
  position: absolute;
  right: 17px;
  top: 50%;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #e8c36d;
}

.open-text {
  position: absolute;
  bottom: 18px;
  left: 0;
  width: 100%;
  text-align: center;
  color: white;
  font-family: Arial, sans-serif;
  font-size: 13px;
}

/* =========================
   STADE
========================= */

.tennis-scene {
  position: absolute;
  inset: 0;
  opacity: 0;
  transform: scale(1.08);
  transition: opacity 2s ease, transform 2s ease;
  background: #8ebd9c;
}

/* ciel */

.sky {
  position: absolute;
  inset: 0 0 43% 0;
  background:
    linear-gradient(
      to bottom,
      #77c9d0 0%,
      #b8dcd1 48%,
      #f2c6bc 100%
    );
}

/* soleil */

.sun {
  position: absolute;
  width: 95px;
  height: 95px;
  right: 12%;
  top: 12%;
  border-radius: 50%;
  background: #ffe4a8;
  box-shadow: 0 0 55px rgba(255, 224, 165, .85);
}

/* nuages */

.cloud {
  position: absolute;
  color: rgba(255,255,255,.55);
  font-size: 55px;
}

.cloud.one {
  left: 8%;
  top: 18%;
}

.cloud.two {
  right: 32%;
  top: 27%;
  font-size: 40px;
}

/* palmiers */

.palm {
  position: absolute;
  z-index: 3;
  font-size: 90px;
  filter: drop-shadow(0 8px 5px rgba(0,0,0,.15));
}

.palm.left {
  left: 0;
  top: 17%;
}

.palm.right {
  right: 0;
  top: 15%;
}

/* tribunes */

.tribune {
  position: absolute;
  left: 5%;
  right: 5%;
  top: 30%;
  height: 17%;
  z-index: 4;
  background:
    repeating-linear-gradient(
      to bottom,
      #496f70 0 13px,
      #759494 13px 17px
    );
  border-radius: 12px 12px 0 0;
  box-shadow: 0 10px 20px rgba(30,60,60,.25);
}

.tribune-top {
  position: absolute;
  left: 0;
  right: 0;
  top: -9px;
  height: 9px;
  background: #d99aa5;
}

/* projecteurs */

.lights {
  position: absolute;
  top: 21%;
  z-index: 5;
  font-size: 42px;
  filter: drop-shadow(0 0 8px rgba(255,255,220,.8));
}

.lights.left {
  left: 8%;
}

.lights.right {
  right: 8%;
}

/* panneaux */

.sign {
  position: absolute;
  top: 36%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 6;
  padding: 7px 20px;
  border-radius: 4px;
  background: #35696b;
  color: #fff;
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
}

/* =========================
   COURT
========================= */

.court {
  position: absolute;
  left: 8%;
  right: 8%;
  bottom: -7%;
  height: 52%;
  z-index: 7;
  background:
    linear-gradient(
      135deg,
      #55c3bb,
      #70cec4
    );
  transform:
    perspective(700px)
    rotateX(45deg);
  border: 5px solid white;
  box-shadow: 0 -12px 30px rgba(35,80,75,.25);
}

.court::before {
  content: "";
  position: absolute;
  inset: 13%;
  border: 3px solid rgba(255,255,255,.95);
}

.court::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 13%;
  bottom: 13%;
  width: 3px;
  background: white;
}

/* lignes horizontales */

.service-line {
  position: absolute;
  left: 13%;
  right: 13%;
  top: 50%;
  height: 3px;
  background: white;
}

/* filet */

.net {
  position: absolute;
  left: 16%;
  right: 16%;
  bottom: 29%;
  height: 8px;
  z-index: 10;
  background: #eee;
  box-shadow: 0 5px 8px rgba(0,0,0,.25);
}

.net::before,
.net::after {
  content: "";
  position: absolute;
  top: -30px;
  width: 6px;
  height: 38px;
  background: #444;
}

.net::before {
  left: 0;
}

.net::after {
  right: 0;
}

/* =========================
   JOUEUR PRINCIPAL
========================= */

.player {
  position: absolute;
  z-index: 15;
}

.main-player {
  left: 50%;
  bottom: 22%;
  transform: translateX(-50%);
}

/* tête vue de dos */

.head {
  position: absolute;
  left: 8px;
  top: -46px;
  width: 45px;
  height: 50px;
  border-radius: 50%;
  background: #a97666;
}

/* cheveux */

.hair {
  position: absolute;
  left: 4px;
  top: -51px;
  width: 53px;
  height: 42px;
  border-radius: 50% 50% 35% 35%;
  background: #293638;
}

/* corps */

.body {
  position: relative;
  width: 62px;
  height: 140px;
  border-radius: 24px 24px 10px 10px;
  background: #283f47;
  box-shadow: 0 10px 15px rgba(0,0,0,.2);
}

/* short */

.shorts {
  position: absolute;
  bottom: 0;
  left: -2px;
  width: 66px;
  height: 42px;
  border-radius: 0 0 10px 10px;
  background: #f1f0eb;
}

/* bras */

.arm {
  position: absolute;
  top: 28px;
  width: 18px;
  height: 82px;
  border-radius: 15px;
  background: #a97666;
}

.arm.left {
  left: -11px;
  transform: rotate(15deg);
}

.arm.right {
  right: -11px;
  transform: rotate(-20deg);
}

/* jambes */

.leg {
  position: absolute;
  bottom: -65px;
  width: 21px;
  height: 70px;
  border-radius: 15px;
  background: #a97666;
}

.leg.left {
  left: 7px;
}

.leg.right {
  right: 7px;
}

/* raquette */

.racket {
  position: absolute;
  right: -83px;
  top: 38px;
  width: 80px;
  height: 125px;
  transform: rotate(14deg);
}

.racket-head {
  position: absolute;
  left: 4px;
  top: 0;
  width: 58px;
  height: 75px;
  border: 5px solid #f4e6cd;
  border-radius: 50%;
}

.racket-head::after {
  content: "";
  position: absolute;
  inset: 8px;
  border: 2px solid rgba(255,255,255,.8);
  border-radius: 50%;
}

.racket-handle {
  position: absolute;
  left: 34px;
  top: 66px;
  width: 8px;
  height: 58px;
  border-radius: 4px;
  background: #70564d;
  transform: rotate(-15deg);
}

/* joueurs au loin */

.small-player {
  transform: scale(.45);
  opacity: .85;
}

.small-player.one {
  left: 25%;
  bottom: 39%;
}

.small-player.two {
  right: 24%;
  bottom: 41%;
}

/* =========================
   DIALOGUE
========================= */

.dialogue {
  position: absolute;
  left: 50%;
  bottom: 5%;
  width: min(90%, 500px);
  transform: translateX(-50%) translateY(30px);
  z-index: 25;
  opacity: 0;
  transition: 1.2s ease;
}

.bubble {
  position: relative;
  padding: 17px 20px;
  border-radius: 24px;
  background: rgba(255,255,255,.96);
  color: #365b63;
  text-align: center;
  font-size: 17px;
  line-height: 1.4;
  box-shadow: 0 12px 30px rgba(30,70,70,.25);
}

.bubble::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -17px;
  transform: translateX(-50%);
  border-left: 17px solid transparent;
  border-right: 17px solid transparent;
  border-top: 20px solid white;
}

/* choix */

.choices {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 20px;
}

.choice {
  width: 100%;
  border: 2px solid rgba(255,255,255,.9);
  border-radius: 30px;
  padding: 12px 18px;
  cursor: pointer;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 15px;
  color: #3e6268;
  background: #f4c8d0;
  box-shadow: 0 7px 18px rgba(40,70,70,.18);
  transition: .25s ease;
}

.choice:nth-child(2) {
  background: #d4eeee;
}

.choice:hover {
  transform: translateY(-3px);
}

/* =========================
   RÉPONSE
========================= */

.answer {
  position: absolute;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
  background: rgba(49,89,91,.35);
  opacity: 0;
  pointer-events: none;
  transition: 1s ease;
}

.answer-box {
  width: min(90%, 430px);
  padding: 30px 23px;
  border-radius: 28px;
  background: rgba(255,255,255,.96);
  text-align: center;
  color: #365b63;
  box-shadow: 0 20px 50px rgba(30,70,70,.3);
}

.answer-box p {
  font-size: 20px;
  line-height: 1.5;
}

.close-answer {
  margin-top: 25px;
  padding: 11px 22px;
  border: none;
  border-radius: 25px;
  background: #65b7b5;
  color: white;
  cursor: pointer;
  font-size: 14px;
}

/* =========================
   OUVERTURE
========================= */

.scene.open .door-scene {
  opacity: 0;
  pointer-events: none;
}

.scene.open .door {
  transform:
    perspective(900px)
    rotateY(-82deg);
}

.scene.open .tennis-scene {
  opacity: 1;
  transform: scale(1);
}

.scene.open .dialogue {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* réponse */

.scene.show-answer .answer {
  opacity: 1;
  pointer-events: auto;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .door-title h1 {
    font-size: 24px;
  }

  .door-title p {
    font-size: 13px;
  }

  .door {
    width: 190px;
    height: 360px;
  }

  .flower-left,
  .flower-right {
    font-size: 45px;
  }

  .palm {
    font-size: 65px;
  }

  .tribune {
    top: 31%;
    left: 2%;
    right: 2%;
  }

  .court {
    left: 1%;
    right: 1%;
    width: 98%;
  }

  .main-player {
    bottom: 24%;
  }

  .bubble {
    font-size: 15px;
  }

  .choice {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<div class="scene" id="scene">

  <!-- =====================
       PORTE
  ====================== -->

  <div class="door-scene" id="doorScene">

    <div class="door-title">
      <h1>Tu veux entrer ?</h1>
      <p>Alors ouvre la porte...</p>
    </div>

    <div class="flower-left">🌿🌸</div>
    <div class="flower-right">🌸🌿</div>

    <div class="door" id="door">

      <div class="door-panel top"></div>
      <div class="door-panel bottom"></div>

      <div class="handle"></div>

      <div class="open-text">
        Clique ici
      </div>

    </div>

  </div>


  <!-- =====================
       STADE
  ====================== -->

  <div class="tennis-scene">

    <div class="sky"></div>

    <div class="sun"></div>

    <div class="cloud one">☁</div>
    <div class="cloud two">☁</div>

    <div class="palm left">🌴</div>
    <div class="palm right">🌴</div>

    <div class="tribune">
      <div class="tribune-top"></div>
    </div>

    <div class="lights left">▦</div>
    <div class="lights right">▦</div>

    <div class="sign">
      TENNIS CLUB
    </div>


    <!-- COURT -->

    <div class="court">
      <div class="service-line"></div>
    </div>

    <div class="net"></div>


    <!-- JOUEUR PRINCIPAL -->

    <div class="player main-player">

      <div class="body">

        <div class="head"></div>
        <div class="hair"></div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <div class="shorts"></div>

        <div class="leg left"></div>
        <div class="leg right"></div>

      </div>

      <div class="racket">
        <div class="racket-head"></div>
        <div class="racket-handle"></div>
      </div>

    </div>


    <!-- JOUEUR AU LOIN 1 -->

    <div class="player small-player one">

      <div class="body">
        <div class="head"></div>
        <div class="hair"></div>
        <div class="shorts"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
      </div>

    </div>


    <!-- JOUEUR AU LOIN 2 -->

    <div class="player small-player two">

      <div class="body">
        <div class="head"></div>
        <div class="hair"></div>
        <div class="shorts"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
      </div>

    </div>

  </div>


  <!-- =====================
       DIALOGUE
  ====================== -->

  <div class="dialogue">

    <div class="bubble">
      Bon… maintenant que t’es là…<br>
      qu’est-ce que tu cherches ?
    </div>

    <div class="choices">

      <button class="choice" onclick="showAnswer(1)">
        ♡ Peut-être toi.
      </button>

      <button class="choice" onclick="showAnswer(2)">
        🎾 Je regardais juste le match... (espionnage 🙂)
      </button>

    </div>

  </div>


  <!-- =====================
       RÉPONSE
  ====================== -->

  <div class="answer" id="answer">

    <div class="answer-box">

      <p id="answerText"></p>

      <button class="close-answer" onclick="closeAnswer()">
        Retour
      </button>

    </div>

  </div>

</div>


<script>

const scene = document.getElementById("scene");
const door = document.getElementById("door");
const answerText = document.getElementById("answerText");

door.addEventListener("click", function () {
  scene.classList.add("open");
});

function showAnswer(choice) {

  if (choice === 1) {

    answerText.textContent =
      "Ça serait mieux de m’envoyer un message alors !";

  } else {

    answerText.textContent =
      "Espionnage ? Bah… c’est le temps de partir alors.";

  }

  scene.classList.add("show-answer");
}

function closeAnswer() {
  scene.classList.remove("show-answer");
}

</script>

</body>
  </html>
