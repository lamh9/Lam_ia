<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tennis Club 🎾</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  overflow:hidden;
  font-family:Georgia,"Times New Roman",serif;
  background:#071f27;
}

/* =========================
   PORTE ROSE
========================= */

#doorScreen{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 45%,
    #ffe8f0 0%,
    #f3a8bd 30%,
    #9c5872 70%,
    #432837 100%);
  transition:opacity 1.2s ease,visibility 1.2s ease;
}

.doorScene{
  text-align:center;
  color:white;
  width:100%;
}

.doorQuestion{
  margin-bottom:30px;
  text-shadow:0 3px 15px rgba(80,20,45,.4);
}

.doorQuestion h1{
  font-size:clamp(30px,7vw,58px);
  font-weight:normal;
  letter-spacing:2px;
}

.doorQuestion p{
  margin-top:12px;
  font-size:clamp(16px,4vw,23px);
  font-style:italic;
}

/* PORTE ROSE */

.door{
  position:relative;
  width:min(270px,70vw);
  height:min(430px,62vh);
  margin:auto;

  border:10px solid #f8c1d4;
  border-radius:10px 10px 4px 4px;

  background:
    linear-gradient(
      90deg,
      #b94f78 0%,
      #e887a8 28%,
      #c85d86 55%,
      #ef9db8 78%,
      #b94f78 100%
    );

  box-shadow:
    0 0 0 5px rgba(255,255,255,.2),
    0 25px 70px rgba(80,20,45,.5),
    inset 0 0 30px rgba(100,30,60,.25);

  cursor:pointer;
  transform-origin:left center;

  transition:
    transform 1.3s cubic-bezier(.7,.1,.2,1);
}

.door:before{
  content:"";
  position:absolute;
  inset:18px;

  border:3px solid rgba(255,235,242,.9);

  box-shadow:
    inset 0 0 0 2px rgba(120,40,70,.25);
}

.door:after{
  content:"";
  position:absolute;
  top:50%;
  right:22px;

  width:14px;
  height:14px;

  border-radius:50%;

  background:#ffe2a8;

  box-shadow:
    0 2px 5px #74384f,
    0 0 8px rgba(255,225,160,.5);
}

.doorText{
  position:absolute;
  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:170px;
  padding:13px 10px;

  border:1px solid rgba(255,255,255,.75);

  background:rgba(120,35,65,.2);

  color:white;

  font-size:17px;
  letter-spacing:2px;

  text-shadow:0 2px 5px rgba(80,20,40,.4);
}

/* =========================
   STADE
========================= */

#stadium{
  position:fixed;
  inset:0;

  opacity:0;
  visibility:hidden;

  transition:opacity 1.5s ease;

  overflow:hidden;

  background:#8fc8c4;
}

#stadium.show{
  opacity:1;
  visibility:visible;
}

/* CIEL */

.sky{
  position:absolute;
  inset:0 0 45% 0;

  background:
    linear-gradient(
      to bottom,
      #80c9c9 0%,
      #a6d5c8 45%,
      #f5b9a6 78%,
      #ef9d8e 100%
    );
}

.sun{
  position:absolute;

  width:95px;
  height:95px;

  border-radius:50%;

  background:#ffe9ad;

  left:50%;
  top:15%;

  transform:translateX(-50%);

  box-shadow:
    0 0 50px rgba(255,236,170,.9);
}

.cloud{
  position:absolute;

  width:130px;
  height:28px;

  border-radius:30px;

  background:rgba(255,255,255,.38);
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;

  border-radius:50%;

  background:rgba(255,255,255,.38);
}

.cloud:before{
  width:48px;
  height:48px;
  left:25px;
  bottom:4px;
}

.cloud:after{
  width:60px;
  height:60px;
  left:55px;
  bottom:0;
}

.cloud.one{
  top:17%;
  left:7%;
}

.cloud.two{
  top:25%;
  right:5%;
  transform:scale(.7);
}

/* =========================
   SOL
========================= */

.ground{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:48%;

  background:
    linear-gradient(
      to bottom,
      #477f58 0%,
      #356b4a 35%,
      #244f3d 100%
    );
}

.garden{
  position:absolute;

  bottom:35%;
  left:0;
  right:0;

  height:80px;

  background:
    radial-gradient(circle at 5% 60%,#285f42 0 30px,transparent 31px),
    radial-gradient(circle at 15% 45%,#39764e 0 35px,transparent 36px),
    radial-gradient(circle at 30% 65%,#2e6946 0 32px,transparent 33px),
    radial-gradient(circle at 50% 45%,#3c7b51 0 36px,transparent 37px),
    radial-gradient(circle at 70% 60%,#286241 0 34px,transparent 35px),
    radial-gradient(circle at 87% 45%,#3a7650 0 38px,transparent 39px);
}

/* =========================
   PALMIERS
========================= */

.palm{
  position:absolute;
  bottom:39%;

  width:90px;
  height:190px;
}

.palm.left{
  left:2%;
}

.palm.right{
  right:2%;
  transform:scale(.85);
}

.palmTrunk{
  position:absolute;

  bottom:0;
  left:42px;

  width:17px;
  height:125px;

  border-radius:12px;

  background:
    linear-gradient(
      90deg,
      #795b38,
      #b18a55,
      #6e4c30
    );

  transform:rotate(7deg);
  transform-origin:bottom;
}

.palmLeaves{
  position:absolute;

  left:5px;
  top:30px;

  width:80px;
  height:80px;
}

.leaf{
  position:absolute;

  width:62px;
  height:13px;

  background:#285e42;

  border-radius:100% 10% 100% 10%;

  transform-origin:100% 50%;
}

.leaf:nth-child(1){
  transform:rotate(-55deg);
  top:20px;
  left:8px;
}

.leaf:nth-child(2){
  transform:rotate(-25deg);
  top:5px;
  left:10px;
}

.leaf:nth-child(3){
  transform:rotate(5deg);
  top:0;
  left:10px;
}

.leaf:nth-child(4){
  transform:rotate(35deg);
  top:8px;
  left:8px;
}

.leaf:nth-child(5){
  transform:rotate(65deg);
  top:22px;
  left:4px;
}

.leaf:nth-child(6){
  transform:rotate(105deg);
  top:33px;
  left:3px;
}

/* =========================
   ZONE TURQUOISE
========================= */

.turquoiseArea{
  position:absolute;

  left:8%;
  right:8%;
  bottom:5%;

  height:38%;

  border-radius:25px;

  background:
    linear-gradient(
      135deg,
      #2f9d9d,
      #66c2bb 50%,
      #318f94
    );

  border:9px solid #176e79;

  box-shadow:
    0 15px 30px rgba(0,0,0,.25),
    inset 0 0 0 3px rgba(255,255,255,.25);
}

/* =========================
   COURT ROSE
========================= */

.court{
  position:absolute;

  left:17%;
  right:17%;
  bottom:9%;

  height:31%;

  background:
    linear-gradient(
      180deg,
      #ef9aa7,
      #e9899a
    );

  border:6px solid #fff3ed;

  box-shadow:
    0 10px 25px rgba(0,0,0,.25),
    inset 0 0 0 3px rgba(145,63,80,.2);

  clip-path:polygon(
    5% 0,
    95% 0,
    100% 100%,
    0 100%
  );
}

/* LIGNES */

.courtLine{
  position:absolute;
  background:white;

  box-shadow:
    0 0 2px rgba(0,0,0,.15);
}

.lineTop{
  left:8%;
  right:8%;
  top:22%;
  height:3px;
}

.lineMiddle{
  top:0;
  bottom:0;
  left:50%;
  width:3px;
  transform:translateX(-50%);
}

.lineBottom{
  left:8%;
  right:8%;
  bottom:22%;
  height:3px;
}

.sideLeft{
  top:22%;
  bottom:22%;
  left:18%;
  width:3px;
}

.sideRight{
  top:22%;
  bottom:22%;
  right:18%;
  width:3px;
}

/* FILET */

.net{
  position:absolute;

  left:11%;
  right:11%;
  top:49%;

  height:4px;

  background:#f9f8f0;

  box-shadow:
    0 0 4px rgba(0,0,0,.25);
}

.net:before,
.net:after{
  content:"";

  position:absolute;

  top:-30px;

  width:5px;
  height:35px;

  background:#f5f1e6;
}

.net:before{
  left:0;
}

.net:after{
  right:0;
}

/* =========================
   STADE
========================= */

.stadiumBack{
  position:absolute;

  left:13%;
  right:13%;
  bottom:43%;

  height:75px;

  border-radius:50% 50% 0 0;

  background:
    repeating-linear-gradient(
      90deg,
      #28747a 0 18px,
      #6bb6ae 18px 25px
    );

  border:5px solid #17616b;

  box-shadow:
    0 10px 15px rgba(0,0,0,.2);
}

.stadiumRail{
  position:absolute;

  left:10%;
  right:10%;
  bottom:40%;

  height:9px;

  background:#166773;

  border-radius:10px;
}

/* =========================
   FLEURS
========================= */

.flowers{
  position:absolute;

  bottom:38%;
  left:0;
  right:0;

  height:35px;

  display:flex;
  justify-content:space-around;
  align-items:flex-end;
}

.flower{
  font-size:23px;

  filter:
    drop-shadow(0 2px 2px rgba(0,0,0,.2));
}

/* =========================
   PANNEAU
========================= */

.clubSign{
  position:absolute;

  top:7%;
  left:50%;

  transform:translateX(-50%);

  padding:9px 24px;

  border:3px solid #176e79;
  border-radius:8px;

  background:#fff7ed;

  color:#176e79;

  font-size:clamp(13px,3vw,20px);

  letter-spacing:4px;

  font-weight:bold;

  box-shadow:
    0 7px 18px rgba(0,0,0,.2);

  z-index:5;
}

/* =========================
   JOUEUR PRINCIPAL
========================= */

.player{
  position:absolute;

  z-index:8;

  left:50%;
  bottom:8%;

  width:150px;
  height:280px;

  transform:translateX(-50%);
}

/* TÊTE */

.playerHead{
  position:absolute;

  width:67px;
  height:75px;

  border-radius:48% 48% 43% 43%;

  background:#c98b69;

  left:41px;
  top:8px;

  z-index:4;
}

.playerHair{
  position:absolute;

  width:75px;
  height:43px;

  left:37px;
  top:1px;

  border-radius:50% 50% 30% 30%;

  background:#33251f;

  z-index:5;
}

.cap{
  position:absolute;

  width:83px;
  height:28px;

  left:33px;
  top:0;

  border-radius:50% 50% 25% 25%;

  background:#176e79;

  z-index:6;
}

.cap:after{
  content:"";

  position:absolute;

  width:50px;
  height:9px;

  right:-25px;
  bottom:1px;

  border-radius:100%;

  background:#176e79;

  transform:rotate(8deg);
}

.playerNeck{
  position:absolute;

  left:59px;
  top:68px;

  width:32px;
  height:30px;

  background:#c98b69;

  z-index:2;
}

/* CORPS */

.playerBody{
  position:absolute;

  left:29px;
  top:83px;

  width:95px;
  height:125px;

  background:
    linear-gradient(
      90deg,
      #f3f1e8,
      #ffffff,
      #d9eee8
    );

  border-radius:25px 25px 15px 15px;

  z-index:3;
}

.playerBody:after{
  content:"";

  position:absolute;

  left:38px;
  top:0;

  width:20px;
  height:115px;

  background:#70bdb6;

  opacity:.65;
}

/* BRAS */

.playerArmLeft,
.playerArmRight{
  position:absolute;

  width:30px;
  height:115px;

  border-radius:25px;

  background:#f4f1e7;

  top:93px;

  z-index:2;
}

.playerArmLeft{
  left:14px;
  transform:rotate(15deg);
}

.playerArmRight{
  right:8px;
  transform:rotate(-35deg);
}

/* JAMBES */

.playerLegLeft,
.playerLegRight{
  position:absolute;

  width:35px;
  height:92px;

  top:195px;

  background:#273f45;

  border-radius:10px;

  z-index:2;
}

.playerLegLeft{
  left:40px;
  transform:rotate(4deg);
}

.playerLegRight{
  right:40px;
  transform:rotate(-4deg);
}

.shoe{
  position:absolute;

  width:50px;
  height:20px;

  background:#f8f5eb;

  border-radius:20px;

  bottom:-5px;
}

.playerLegLeft .shoe{
  left:-12px;
}

.playerLegRight .shoe{
  right:-12px;
}

/* =========================
   🎾 RAQUETTE
========================= */

.racket{
  position:absolute;

  z-index:20;

  width:72px;
  height:150px;

  right:-25px;
  top:88px;

  transform:rotate(18deg);
}

.racketHead{
  position:absolute;

  top:0;
  left:4px;

  width:63px;
  height:87px;

  border:5px solid #f7f3df;

  border-radius:50%;

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 8px,
      rgba(255,255,255,.65) 9px 10px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0 8px,
      rgba(255,255,255,.65) 9px 10px
    );

  box-shadow:
    0 3px 8px rgba(0,0,0,.35),
    inset 0 0 0 2px #4d9e9b;
}

.racketBridge{
  position:absolute;

  top:78px;
  left:27px;

  width:20px;
  height:16px;

  border-left:4px solid #f7f3df;
  border-right:4px solid #f7f3df;
}

.racketHandle{
  position:absolute;

  top:90px;
  left:31px;

  width:13px;
  height:57px;

  border-radius:5px;

  background:
    linear-gradient(
      90deg,
      #a86c43,
      #d59b63,
      #8a5436
    );

  box-shadow:
    2px 3px 5px rgba(0,0,0,.3);
}

.racketGrip{
  position:absolute;

  bottom:0;
  left:27px;

  width:21px;
  height:25px;

  border-radius:5px;

  background:#176e79;

  box-shadow:
    2px 3px 5px rgba(0,0,0,.3);
}

/* =========================
   PETITS JOUEURS
========================= */

.smallPlayer{
  position:absolute;

  z-index:7;

  bottom:40%;

  width:65px;
  height:125px;
}

.smallPlayer.one{
  left:24%;
}

.smallPlayer.two{
  right:24%;
}

.smallHead{
  position:absolute;

  top:0;
  left:20px;

  width:27px;
  height:31px;

  border-radius:50%;

  background:#b9795c;
}

.smallBody{
  position:absolute;

  top:28px;
  left:11px;

  width:45px;
  height:57px;

  border-radius:15px;

  background:#f4f0e6;
}

.smallLeg1,
.smallLeg2{
  position:absolute;

  top:78px;

  width:15px;
  height:45px;

  background:#31434a;

  border-radius:8px;
}

.smallLeg1{
  left:18px;
}

.smallLeg2{
  left:35px;
}

/* =========================
   DIALOGUE
========================= */

.dialogue{
  position:absolute;

  z-index:15;

  left:50%;
  bottom:4%;

  transform:translateX(-50%);

  width:min(430px,90vw);

  padding:17px 20px 15px;

  background:rgba(255,249,240,.96);

  border:3px solid #176e79;

  border-radius:18px;

  box-shadow:
    0 12px 35px rgba(0,0,0,.28);

  text-align:center;
}

.dialogueText{
  color:#24464b;

  font-size:17px;
  line-height:1.4;

  margin-bottom:12px;
}

.choices{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.choice{
  border:1px solid #5aa8a4;

  background:#fff;

  color:#24565a;

  border-radius:12px;

  padding:10px;

  font-family:inherit;

  font-size:14px;

  cursor:pointer;

  transition:.25s;
}

.choice:hover{
  background:#dff3f0;
  transform:translateY(-2px);
}

/* =========================
   REPONSE
========================= */

.response{
  position:absolute;

  z-index:30;

  inset:0;

  display:none;

  justify-content:center;
  align-items:center;

  background:rgba(17,51,55,.45);

  backdrop-filter:blur(4px);
}

.responseBox{
  width:min(430px,88vw);

  padding:35px 25px;

  border-radius:22px;

  background:#fff8ef;

  border:4px solid #176e79;

  box-shadow:
    0 20px 50px rgba(0,0,0,.3);

  text-align:center;

  color:#24565a;

  animation:pop .4s ease;
}

.responseBox p{
  font-size:21px;

  line-height:1.5;

  margin-bottom:20px;
}

.closeBtn{
  border:0;

  background:#176e79;

  color:white;

  padding:10px 22px;

  border-radius:12px;

  font-family:inherit;

  cursor:pointer;
}

@keyframes pop{
  from{
    transform:scale(.7);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .clubSign{
    top:4%;
    letter-spacing:2px;
    padding:7px 15px;
  }

  .stadiumBack{
    left:7%;
    right:7%;
    height:60px;
  }

  .turquoiseArea{
    left:3%;
    right:3%;
    bottom:4%;
    height:36%;
    border-width:7px;
  }

  .court{
    left:10%;
    right:10%;
    bottom:8%;
    height:29%;
    border-width:4px;
  }

  .palm{
    transform:scale(.72);
    transform-origin:bottom;
  }

  .palm.left{
    left:-12px;
  }

  .palm.right{
    right:-12px;
    transform:scale(.62);
  }

  .player{
    transform:translateX(-50%) scale(.83);
    transform-origin:bottom center;
    bottom:7%;
  }

  .smallPlayer.one{
    left:18%;
  }

  .smallPlayer.two{
    right:18%;
  }

  .dialogue{
    bottom:2%;
    padding:13px 14px 11px;
  }

  .dialogueText{
    font-size:15px;
    margin-bottom:8px;
  }

  .choice{
    font-size:13px;
    padding:8px;
  }
}
</style>
</head>

<body>

<!-- =========================
     PORTE
========================= -->

<section id="doorScreen">

  <div class="doorScene">

    <div class="doorQuestion">
      <h1>Tu veux entrer ?</h1>
      <p>Alors ouvre la porte...</p>
    </div>

    <div class="door" id="door">

      <div class="doorText">
        Clique ici
      </div>

    </div>

  </div>

</section>


<!-- =========================
     STADE
========================= -->

<section id="stadium">

  <div class="sky"></div>

  <div class="sun"></div>

  <div class="cloud one"></div>
  <div class="cloud two"></div>

  <div class="ground"></div>

  <div class="garden"></div>


  <!-- PALMIER GAUCHE -->

  <div class="palm left">

    <div class="palmTrunk"></div>

    <div class="palmLeaves">
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
    </div>

  </div>


  <!-- PALMIER DROIT -->

  <div class="palm right">

    <div class="palmTrunk"></div>

    <div class="palmLeaves">
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
    </div>

  </div>


  <div class="stadiumBack"></div>

  <div class="stadiumRail"></div>


  <div class="clubSign">
    TENNIS CLUB
  </div>


  <!-- ZONE TURQUOISE -->

  <div class="turquoiseArea"></div>


  <!-- COURT -->

  <div class="court">

    <div class="courtLine lineTop"></div>
    <div class="courtLine lineMiddle"></div>
    <div class="courtLine lineBottom"></div>
    <div class="courtLine sideLeft"></div>
    <div class="courtLine sideRight"></div>

    <div class="net"></div>

  </div>


  <!-- FLEURS -->

  <div class="flowers">
    <div class="flower">🌷</div>
    <div class="flower">🌸</div>
    <div class="flower">🌼</div>
    <div class="flower">🌷</div>
    <div class="flower">🌸</div>
  </div>


  <!-- JOUEUR GAUCHE -->

  <div class="smallPlayer one">

    <div class="smallHead"></div>
    <div class="smallBody"></div>
    <div class="smallLeg1"></div>
    <div class="smallLeg2"></div>

  </div>


  <!-- JOUEUR DROIT -->

  <div class="smallPlayer two">

    <div class="smallHead"></div>
    <div class="smallBody"></div>
    <div class="smallLeg1"></div>
    <div class="smallLeg2"></div>

  </div>


  <!-- JOUEUR PRINCIPAL -->

  <div class="player">

    <div class="playerHair"></div>

    <div class="cap"></div>

    <div class="playerHead"></div>

    <div class="playerNeck"></div>

    <div class="playerBody"></div>

    <div class="playerArmLeft"></div>

    <div class="playerArmRight"></div>

    <div class="playerLegLeft">
      <div class="shoe"></div>
    </div>

    <div class="playerLegRight">
      <div class="shoe"></div>
    </div>


    <!-- RAQUETTE -->

    <div class="racket">

      <div class="racketHead"></div>

      <div class="racketBridge"></div>

      <div class="racketHandle"></div>

      <div class="racketGrip"></div>

    </div>

  </div>


  <!-- DIALOGUE -->

  <div class="dialogue">

    <div class="dialogueText">
      Bon… maintenant que t’es là…<br>
      qu’est-ce que tu cherches ?
    </div>

    <div class="choices">

      <button class="choice" onclick="showResponse(1)">
        ♡ « Peut-être toi. »
      </button>

      <button class="choice" onclick="showResponse(2)">
        🎾 « Je regardais juste le match... (espionnage 🙂) »
      </button>

    </div>

  </div>


  <!-- REPONSE -->

  <div class="response" id="response">

    <div class="responseBox">

      <p id="responseText"></p>

      <button class="closeBtn" onclick="closeResponse()">
        Retour
      </button>

    </div>

  </div>

</section>


<script>

const door = document.getElementById("door");

const doorScreen =
  document.getElementById("doorScreen");

const stadium =
  document.getElementById("stadium");


door.addEventListener("click",function(){

  door.style.transform =
    "perspective(1000px) rotateY(-105deg)";

  setTimeout(function(){

    doorScreen.style.opacity="0";

    doorScreen.style.visibility="hidden";

    stadium.classList.add("show");

  },850);

});


function showResponse(choice){

  const response =
    document.getElementById("response");

  const text =
    document.getElementById("responseText");


  if(choice===1){

    text.textContent =
      "Ça serait mieux de m’envoyer un message alors !";

  }else{

    text.textContent =
      "Espionnage ? Bah… c’est le temps de partir alors.";

  }


  response.style.display="flex";
}


function closeResponse(){

  document.getElementById("response")
    .style.display="none";

}

</script>

</body>
  </html>
