<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🎾 Lam_ia</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #d9edf2;
      font-family: Georgia, serif;
    }

    .scene {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background:
        linear-gradient(
          135deg,
          #d8edf1,
          #f5d7dc
        );
    }

    .message {
      position: absolute;
      top: 12%;
      text-align: center;
      color: #59434b;
      z-index: 5;
    }

    .message h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .message p {
      font-family: Arial, sans-serif;
      font-size: 14px;
      opacity: 0.7;
    }

    /* LA PORTE */

    .door {
      width: 230px;
      height: 420px;
      background: #b87d89;
      border: 10px solid #76525b;
      border-radius: 8px 8px 0 0;
      position: relative;
      cursor: pointer;

      box-shadow:
        0 25px 50px rgba(60, 40, 45, 0.3);

      transition: transform 1s ease;
      transform-origin: left center;
    }

    .door:hover {
      transform: scale(1.02);
    }

    /* décoration de la porte */

    .door::before,
    .door::after {
      content: "";
      position: absolute;
      left: 25px;
      right: 25px;
      height: 120px;
      border: 3px solid rgba(80, 50, 60, 0.35);
    }

    .door::before {
      top: 35px;
    }

    .door::after {
      bottom: 35px;
    }

    /* poignée */

    .handle {
      position: absolute;
      right: 18px;
      top: 50%;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #e8c26c;
      box-shadow: 0 0 0 4px rgba(0,0,0,0.08);
    }

    /* petit texte sur la porte */

    .door-text {
      position: absolute;
      bottom: 18px;
      width: 100%;
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
      opacity: 0.8;
    }

    /* petit effet lumineux */

    .glow {
      position: absolute;
      width: 300px;
      height: 500px;
      background: radial-gradient(
        ellipse,
        rgba(255, 190, 220, 0.65),
        transparent 70%
      );

      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }

    .scene.open .glow {
      opacity: 1;
    }

    .scene.open .door {
      transform: perspective(900px) rotateY(-82deg);
    }

    @media (max-width: 600px) {

      .door {
        width: 190px;
        height: 360px;
      }

      .message h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <div class="scene" id="scene">

    <div class="message">
      <h1>Tu veux entrer ?</h1>
      <p>Alors ouvre la porte...</p>
    </div>

    <div class="glow"></div>

    <div class="door" id="door">

      <div class="handle"></div>

      <div class="door-text">
        ✦ clique ici ✦
      </div>

    </div>

  </div>

  <script>

    const door = document.getElementById("door");
    const scene = document.getElementById("scene");

    door.addEventListener("click", function () {

      scene.classList.add("open");

    });

  </script>

</body>
  </html>
